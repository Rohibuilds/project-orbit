name: Test ORBIT
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install application test dependencies
        run: python -m pip install Flask==3.1.1 requests==2.32.4 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Check syntax and installer
        run: |
          python -m compileall -q orbit.py modules
          bash -n install.sh
      - name: Regression tests without physical hardware
        run: python -m unittest discover -s tests -v
